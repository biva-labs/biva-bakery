<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="preload">
    <link rel="icon" type="image/svg+xml" href="/biva-logo.webp" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Biva</title>
    <style>
      #app-preloader {
        position: fixed;
        inset: 0;
        background: #ffffff;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 99999;
        opacity: 1;
        transition: opacity 0.4s ease;
      }
      #app-preloader.fade-out {
        opacity: 0;
        pointer-events: none;
      }
      .biva-spinner {
        width: 44px;
        height: 44px;
        border-radius: 50%;
        border: 3px solid #f0f0f0;
        border-top-color: #DE4243;
        animation: biva-spin 0.75s linear infinite;
      }
      @keyframes biva-spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div id="app-preloader">
      <div class="biva-spinner"></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
