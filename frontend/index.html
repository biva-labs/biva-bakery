<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="preload">
    <link rel="icon" type="image/svg+xml" href="/biva-logo.webp" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Biva</title>
    <style>
      #app-preloader {
        position: fixed;
        inset: 0;
        background: #ffffff;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 99999;
        opacity: 1;
        transition: opacity 0.4s ease;
        gap: 16px;
      }
      #app-preloader.fade-out {
        opacity: 0;
        pointer-events: none;
      }
      .biva-spinner {
        width: 52px;
        height: 52px;
        border-radius: 50%;
        border: 3px solid #e5e5e5;
        border-top-color: #DE4243;
        animation: biva-spin 0.75s linear infinite;
      }
      .biva-loader-label {
        font-family: Outfit, sans-serif;
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.24em;
        text-transform: uppercase;
        color: #737373;
      }
      @keyframes biva-spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div id="app-preloader">
      <div class="biva-spinner"></div>
      <div class="biva-loader-label">Loading</div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
